<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flag Fight</title>
<meta name="description" content="Flag Fight: the playground capture-the-flag game, with drafted characters and powers. Two players, one screen.">
<meta name="theme-color" content="#0E131C">
<meta property="og:title" content="Flag Fight">
<meta property="og:description" content="The playground game, with powers. Draft 6 characters, steal the flag, don't get tagged.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E131C'/%3E%3Crect x='18' y='10' width='5' height='44' rx='2' fill='%23F1EDE4'/%3E%3Cpath d='M23 12 L52 22 L23 34Z' fill='%235B94FF'/%3E%3Cpath d='M23 30 L46 38 L23 46Z' fill='%23FF6459'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--cell:clamp(14px,calc((100vw - 640px)/30.7),28px);--bg:#0E131C;--panel:#172030;--panel2:#243249;--line:#3A4D6B;--text:#EEF2F8;--muted:#9FB0C8;--soft:#B4C2D8;--gold:#FFD54A;--blue:#5B94FF;--red:#FF6459;--green:#2F6A3F;--greenl:#4A9A5F;--ink:#1A1A2E;--night:#0A0F1C;--disp:'Bricolage Grotesque','Figtree',system-ui,sans-serif;--body:'Figtree',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 var(--body);min-height:100vh}
h1,h2,h3,p{margin:0}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1480px;margin:0 auto;padding:16px 20px}
.grow{flex:1}
.chip{display:inline-block;padding:4px 14px;border-radius:999px;font-weight:800;color:var(--night)}
.chip.t1{background:var(--blue)}.chip.t2{background:var(--red)}
.lbl{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.btn{min-height:44px;padding:0 18px;border-radius:10px;background:var(--panel2);color:var(--text);border:1px solid var(--line);font-size:14px;font-weight:700}
.btn:hover:not(:disabled){background:#2e3f5c}
.btn.pri{background:var(--green);color:#fff;border-color:var(--greenl)}
.btn.pri:hover:not(:disabled){background:#38804c}
.btn.ghost{background:transparent;border-width:2px}
.btn:disabled{opacity:.4}
.btn.gold{background:var(--gold);color:var(--ink);border:4px solid var(--ink);box-shadow:4px 4px 0 #05080F;font-size:20px;font-weight:800;min-height:60px;border-radius:16px}
.btn.gold:hover:not(:disabled){background:#ffe073}
.tbar{display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:12px;padding:8px 16px;min-height:52px;margin-bottom:14px}
.dicerow{display:flex;gap:8px}
.die{width:40px;height:40px;border-radius:9px;background:#F6F3EA;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:6px}
.die.sm{width:34px;height:34px;border-radius:8px;padding:5px}
.die i{border-radius:50%;margin:1px}.die i.on{background:var(--night)}
.die.used{opacity:.35}
.die.rolling{animation:tumble .3s linear infinite}
@keyframes tumble{0%{transform:rotate(0) translateY(0)}25%{transform:rotate(90deg) translateY(-8px)}50%{transform:rotate(180deg) translateY(0)}75%{transform:rotate(270deg) translateY(-8px)}100%{transform:rotate(360deg) translateY(0)}}
.die.land{animation:land .28s cubic-bezier(.2,1.6,.4,1)}
@keyframes land{from{transform:scale(1.5) rotate(-12deg)}to{transform:none}}
.play{display:grid;grid-template-columns:248px minmax(0,1fr) 248px;gap:16px;align-items:start;justify-content:center}
@media(max-width:1100px){.play{grid-template-columns:1fr}.rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}.rail .rh{grid-column:1/-1}}
.rail{display:flex;flex-direction:column;gap:10px}
.rh{display:flex;align-items:center;gap:8px;height:30px;color:var(--muted);font-size:12px}
.pipsr{display:flex;gap:4px}.pipsr i{width:12px;height:12px;border-radius:50%;background:#35425A}.pipsr i.on{background:var(--gold)}
.center{display:flex;flex-direction:column;gap:12px;min-width:0;align-items:center}
.boardwrap{position:relative;width:max-content;max-width:100%}
#board{position:relative;display:grid;grid-template-columns:repeat(30,var(--cell));grid-auto-rows:var(--cell);gap:1px;width:max-content;background:#05080F;border:3px solid #05080F;border-radius:8px;overflow:hidden}
.c{position:relative;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(var(--cell)*.54);color:#E4F1FF;user-select:none}
.c.l1{background:#1A3052}.c.l1.k{background:#172B4D}
.c.l2{background:#42222F}.c.l2.k{background:#3C1F2C}
.c.x14::after{content:'';position:absolute;right:-2px;top:0;bottom:0;width:3px;background:#F4F1E8;z-index:1}
.c.safe{background-image:radial-gradient(circle,rgb(255 255 255 / .6) calc(var(--cell)*.11),transparent calc(var(--cell)*.11 + .5px))}
.c.st{box-shadow:inset 0 0 0 2px rgb(255 255 255 / .5)}
.c.mud{background:#7A5630}
.c.slide{background:#2F6AA8}
.c.jail{background:#4B5060}
.c.wall{background:linear-gradient(#0004 1px,transparent 1px) 0 0/100% 33%,linear-gradient(90deg,#0004 1px,transparent 1px) 0 0/50% 33%,#B86A42}
.c.hl{background-color:#6B5B1E;box-shadow:inset 0 0 0 3px var(--gold);cursor:pointer;animation:pulse 1s ease-in-out infinite;z-index:2}
@keyframes pulse{50%{box-shadow:inset 0 0 0 3px #fff}}
.cnt{font-weight:800;color:#fff;font-size:calc(var(--cell)*.7)}
.p{position:relative;width:calc(var(--cell) - 4px);height:calc(var(--cell) - 4px);border-radius:50%;border:2px solid #F6F3EA;color:var(--night);font-weight:800;font-size:calc(var(--cell)*.42);display:flex;align-items:center;justify-content:center;z-index:3}
.p.l3{font-size:calc(var(--cell)*.32)}
.p.t1{background:var(--blue)}.p.t2{background:var(--red)}
.p.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgb(255 213 74 / .55)}
.p .badge{position:absolute;top:-45%;right:-40%;width:70%;height:90%}
.p .frz{position:absolute;top:-30%;left:-20%;color:#bff0ff;font-size:1.3em}
.tree{position:absolute;inset:2px;width:calc(100% - 4px);height:calc(100% - 4px)}
.mk{width:80%;height:80%}
.flag{position:absolute;left:12%;top:4%;width:78%;height:92%;z-index:1}
.dock{width:100%;max-width:875px;background:var(--panel);border:2px solid #2A3850;border-radius:16px;padding:12px;display:flex;gap:14px;align-items:flex-start}
.dock.live{border-color:var(--gold)}
.dock .dl{width:250px;flex:none}
.dock .dr{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.dprompt{font-family:var(--disp);font-weight:800;font-size:20px;line-height:1.2}
.dbtns{display:flex;gap:8px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.tile{min-height:58px;text-align:left;padding:7px 12px;border-radius:12px;background:#243249;border:2px solid var(--line);color:var(--text);display:flex;flex-direction:column;justify-content:center;gap:1px}
.tile:hover:not(:disabled){background:#2e3f5c}
.tile .tn{font-weight:800;font-size:14px}.tile .td{font-size:11.5px;color:var(--soft)}
.tile:disabled{background:#121A2B;border-color:#1E2A3F;color:#6E7F99}.tile:disabled .td{color:#6E7F99}
.nosel{height:124px;border:3px dashed var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:13px;padding:0 16px}
.legend{display:flex;gap:6px 18px;flex-wrap:wrap;color:var(--muted);font-size:12px;justify-content:center}
.logp{width:100%;max-width:875px;background:var(--panel);border-radius:12px;padding:12px 16px;min-height:150px}
.logp h3{font-family:var(--disp);font-size:16px;margin-bottom:6px}
.logp div{font-size:13px;color:var(--muted);padding:3px 0 4px;border-bottom:1px solid #25324A}
.logp div:first-of-type{color:var(--text)}
.logs{max-height:240px;overflow:auto}
/* pennant card */
.pn{--tab:#FFD54A;--sh:#6B7A99;--r:14px;--nfs:22px;--numfs:36px;--hp:9px 12px 26px;--bp:0 10px 10px;--fs:11.5px;--gap:6px;--pp:6px 8px;--shw:34px;--shh:40px;font-family:var(--body);position:relative;width:100%}
.pn.t1{--tab:var(--blue);--sh:var(--blue)}.pn.t2{--tab:var(--red);--sh:var(--red)}
.pn.jail{--tab:#B9B6C4}.pn.frozen{--tab:#8FD8F5}
.pn.lg{--r:16px;--nfs:28px;--numfs:46px;--hp:12px 14px 34px;--bp:2px 14px 14px;--fs:13.5px;--gap:8px;--pp:8px 10px;--shw:44px;--shh:52px}
.pn.cl{--nfs:18px;--numfs:26px;--hp:7px 10px 14px;--bp:0 8px 8px;--gap:4px;--pp:4px 6px;--shw:24px;--shh:28px}
.pn-in{background:#fff;border:3px solid var(--ink);border-radius:var(--r);overflow:hidden;box-shadow:4px 4px 0 var(--sh);color:var(--ink)}
.pn.frozen .pn-in{background:#EAF7FD}
.pn.jail{filter:grayscale(1) brightness(.92)}
.pn.sel .pn-in{outline:4px solid var(--gold)}
.pn-tab{background:var(--tab);clip-path:polygon(0 0,100% 0,100% 78%,50% 100%,0 78%);padding:var(--hp);display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.pn-nm{display:flex;flex-direction:column;gap:2px;min-width:0}
.pn-name{font-family:var(--disp);font-weight:800;font-size:var(--nfs);line-height:1}
.pn-type{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.pn-num{font-family:var(--disp);font-weight:800;font-size:var(--numfs);line-height:.9;color:#FFF8E7;text-shadow:2px 2px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
.pn-body{padding:var(--bp);display:flex;flex-direction:column;gap:var(--gap)}
.pn-act{font-size:var(--fs);line-height:1.3}
.pn-act b{font-weight:800}
.pn-act i{font-style:normal;background:var(--ink);color:var(--gold);font-size:9.5px;font-weight:800;border-radius:4px;padding:1px 6px;margin-left:4px;white-space:nowrap;vertical-align:1px}
.pn-e{color:#3B3550}
.pn.cl .pn-e{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pn-pas{background:#DDF3D4;border:2px solid #2E6B3B;border-radius:10px;padding:var(--pp);display:flex;gap:8px;align-items:center}
.pn.frozen .pn-pas{background:#DDF3D4}
.pn-pt{display:flex;flex-direction:column;gap:3px;min-width:0}
.pn-p{font-size:var(--fs);line-height:1.3}
.pn.cl .pn-p{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.pn-p b{font-weight:800}
.shield{flex:none;width:var(--shw);height:var(--shh)}.shield svg{width:100%;height:100%;display:block}
/* draft */
.dhead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:18px}
.dhead h1{font-family:var(--disp);font-weight:800;font-size:44px;line-height:1}
.order{display:flex;gap:5px}
.order span{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;border:2px solid var(--line);color:var(--muted)}
.drow{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap;margin-bottom:18px}
.slotp{flex:1 1 400px;background:var(--panel);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.slotp.r{align-items:flex-end}
.slots{display:flex;gap:10px}
.slot{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:var(--night);border:3px dashed var(--line)}
.slot.full{border-style:solid;border-color:var(--night)}
.pickp{flex:1 1 260px;background:#2A2410;border:2px solid var(--gold);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;text-align:center}
.pickp .big{font-family:var(--disp);font-weight:800;font-size:26px;line-height:1.1}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px 16px;align-items:start}
.pool>div{display:flex;flex-direction:column;gap:8px}
.dbtn{min-height:44px;border-radius:12px;color:var(--ink);border:3px solid var(--ink);font-weight:800;font-size:14px;box-shadow:3px 3px 0 var(--ink);width:100%}
.dbtn.t1{background:var(--blue)}.dbtn.t2{background:var(--red)}
.took{min-height:44px;border-radius:12px;color:var(--ink);border:3px solid var(--ink);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
.took.t1{background:var(--blue)}.took.t2{background:var(--red)}
/* title */
.title{position:relative;min-height:100vh;overflow:hidden;background:var(--bg)}
.title .bgb{position:absolute;left:-120px;top:180px;opacity:.5;transform:rotate(-6deg);--cell:36px}
.title .wash{position:absolute;inset:0;background:linear-gradient(90deg,rgb(14 19 28 / .1) 0%,rgb(14 19 28 / .85) 62%,#0E131C 100%)}
.title .big{position:absolute;left:60px;top:80px}
.title h1{font-family:var(--disp);font-weight:800;font-size:clamp(56px,7vw,96px);line-height:.9;text-shadow:5px 5px 0 #05080F}
.title .tag{color:#CBD5E4;font-size:20px;margin-top:8px}
.newgame{position:absolute;right:60px;top:90px;width:min(500px,calc(100vw - 40px));background:var(--panel);border:3px solid var(--gold);border-radius:22px;padding:26px;display:flex;flex-direction:column;gap:18px}
@media(max-width:1000px){.title .big{position:relative;left:0;top:0;padding:40px 24px 0}.newgame{position:relative;right:auto;top:auto;margin:24px auto}}
.newgame .nt{font-family:var(--disp);font-weight:800;font-size:30px}
.newgame label{font-size:13px;color:var(--muted)}
.newgame input[type=text]{min-height:48px;border-radius:12px;background:var(--bg);color:var(--text);border:2px solid;padding:0 14px;font-size:16px;font-family:inherit;width:100%}
.newgame .chk{display:flex;align-items:flex-start;gap:10px;font-size:14px;color:#CBD5E4;line-height:1.35}
.newgame .chk input{width:22px;height:22px;flex:none}
/* toss */
.toss{min-height:100vh;position:relative;overflow:hidden;color:var(--night);display:flex;flex-direction:column;justify-content:flex-end;padding:70px clamp(24px,6vw,90px)}
.toss.t1{background:var(--blue)}.toss.t2{background:var(--red)}
.toss .coin{position:absolute;right:-120px;top:-120px;width:620px;height:620px;border-radius:50%;background:var(--gold);border:18px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:200px;color:var(--night);padding:0 150px 150px 0}
.toss .res{font-family:var(--disp);font-weight:800;font-size:clamp(80px,19vw,300px);line-height:.85;letter-spacing:-.03em;text-transform:uppercase;position:relative}
.toss .btn{background:var(--night);color:#fff;border:none;min-height:64px;padding:0 52px;border-radius:14px;font-size:19px;font-weight:800}
/* popups */
.ov{position:fixed;inset:0;background:rgb(5 8 15 / .72);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.pop{position:relative;width:min(1180px,100%);background:var(--panel);border:3px solid var(--gold);border-radius:22px;padding:24px 28px;display:flex;flex-direction:column;gap:20px}
.pop .ph{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pop .pt{font-family:var(--disp);font-weight:800;font-size:34px;line-height:1}
.pgrid{display:grid;grid-template-columns:1fr minmax(240px,400px) 1fr;gap:22px;align-items:center}
@media(max-width:900px){.pgrid{grid-template-columns:1fr}}
.pc3{display:flex;flex-direction:column;align-items:center;gap:14px}
.bigdie{width:96px;height:96px;border-radius:22px;background:#F6F3EA;border:4px solid var(--night);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:13px;transform:rotate(-8deg)}
.bigdie i{border-radius:50%;margin:2px}.bigdie i.on{background:var(--night)}
.bigdie.q{align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:50px;color:var(--night);display:flex;padding:0}
.bigdie.rolling{animation:tumble .3s linear infinite}
.meter{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%}
.mt{height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;border:3px solid #7A2F33;background:#3A1F24}
.mt.ok{background:#1F3A2A;border-color:#2E6B3B}.mt.cur{border-color:var(--gold)}
.mlbl{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:4px;width:100%}
.stamp{border:4px solid var(--night);border-radius:10px;font-family:var(--disp);font-weight:800;font-size:32px;padding:2px 20px;transform:rotate(-4deg);color:var(--night)}
.stamp.tag{background:var(--red)}.stamp.sav{background:#8FD08A}
.pfoot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid #2A3850;padding-top:16px}
.pfoot .msg{color:var(--muted);font-size:13px;flex:1 1 260px}
.pfoot .btn{min-height:52px;font-size:15px}
.spec{width:min(980px,100%);display:grid;grid-template-columns:1fr minmax(220px,300px) 1fr;gap:24px;align-items:center;padding:26px}
@media(max-width:900px){.spec{grid-template-columns:1fr}}
.eye{position:absolute;right:14px;top:14px;width:48px;height:48px;border-radius:50%;background:var(--panel2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.disc{width:150px;height:150px;border-radius:50%;background:var(--gold);border:6px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:44px;color:var(--ink);text-align:center;line-height:1}
.sbox{background:#11182A;border:2px solid var(--line);border-radius:12px;padding:10px 14px}
.sbox.dim{opacity:.55}
.peekback{position:fixed;right:20px;top:20px;z-index:25;min-height:48px;padding:0 18px;border-radius:999px;background:var(--panel2);color:var(--text);border:2px solid var(--gold);font-weight:700}
.capbar{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:20;width:min(1115px,calc(100vw - 24px));background:#172A55;border:3px solid var(--gold);border-radius:18px;padding:12px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.capbar .ct{font-family:var(--disp);font-weight:800;font-size:40px;line-height:1;color:var(--gold)}
.capbar .cx{color:#D0DBF0;font-size:16px;flex:1 1 260px}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(440px,100vw);z-index:20;background:var(--panel);border-left:2px solid var(--gold);padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.drawer .dt{font-family:var(--disp);font-weight:800;font-size:22px}
.cap1{display:flex;gap:10px;align-items:center}.cap1>div{flex:1;min-width:0}
.banner{position:fixed;left:50%;top:14%;transform:translateX(-50%);background:rgb(10 15 28 / .94);border:3px solid var(--gold);border-radius:16px;padding:16px 30px;font-family:var(--disp);font-weight:800;font-size:28px;text-align:center;z-index:40;max-width:92vw;animation:pop .25s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:translateX(-50%) scale(.8)}}
/* over */
.over{position:fixed;inset:0;z-index:50;overflow:auto;color:#F1F5FF}
.over.t1{background:#0D1B45;--ac:#5B94FF;--sub:#9DBBFF;--sh:#060E26}
.over.t2{background:#3D0F14;--ac:#FF6459;--sub:#FF9E96;--sh:#1F060A}
.over .cf{position:absolute;border-radius:2px;opacity:.7}
.over .in{position:relative;display:flex;gap:40px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:100vh;padding:40px}
.over .l{max-width:700px;display:flex;flex-direction:column;gap:18px}
.over .go{color:var(--sub);font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.over .wins{font-family:var(--disp);font-weight:800;font-size:clamp(70px,11vw,150px);line-height:.9;color:var(--ac);text-shadow:6px 6px 0 var(--sh)}
.over .why{font-size:24px;line-height:1.35}
.over .acts{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}

<body>
<div class="wrap" id="app"></div>
<div id="fx"></div>
<script>
'use strict';
const W=30,H=15;
const rnd=n=>Math.floor(Math.random()*n), d6=()=>1+rnd(6);
const sleep=ms=>window.__fast?Promise.resolve():new Promise(r=>setTimeout(r,ms));
const tn=t=>(typeof G!=='undefined'&&G&&G.names&&G.names[t])||(t===1?'Blue':'Red');
const terr=x=>x<=14?1:2;
const dist=(a,b)=>Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y));
const rot=(x,y)=>[W-1-x,H-1-y];
const D4=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}], HD=D4.slice(0,2), VD=D4.slice(2);
class GameOver extends Error{}

// [name,type,save,passive,active]
const ROSTER=[
['Zoe','Sprinter',5,'Quick Feet: +1 to the die used when it moves.','Second Wind: move up to 2 extra squares in a straight line.'],
['Danny','Dodger',3,'Slippery: the best Save in the game.','Juke: re-roll a failed Saving Throw (reaction).'],
['Rosie','Rescuer',4,'Helping Hand: can free a jailed teammate from just outside the jail (1 square away).','Jailbreak: free ALL jailed teammates.'],
['Hudson','Hopper',4,'Hurdle: may hop over one piece or tree in its path.','Big Leap: jump over pieces in a straight line, up to 3 squares.'],
['Gabe','Guardian',3,'Stand Firm: adjacent teammates get +1 on Saves. | Big Shoes: cannot be shoved or swapped.','Take the Tag: when a teammate within 2 is tagged, Gabe takes the tag instead (reaction).'],
['Scarlett','Scout',4,'Light Pack: carries the flag without the -1 penalty.','Shortcut: swap places with a teammate within 4.'],
['Cal','Captain',4,'Team Spirit: your team may hold 4 power tokens.','Pep Talk: re-roll one die. | Rally Cry: every teammate may move 1 square.'],
['Shay','Shadow Kid',5,'Stealth: can only be tagged from adjacent.','Shadow Step: teleport to any safe square within 6.'],
['Bo','Big Kid',3,'Long Arms: tag range is 3 squares.','Shove: push an adjacent enemy 2 squares away.'],
['Tessa','Trickster',5,'Sticky Fingers: gains an extra token when it jails an enemy.','Switcheroo: swap places with any character within 3.'],
['Mia','Medic',4,'First Aid: when a teammate within 2 is tagged, it may re-roll once.','Patch Up: a teammate within 3 re-rolls a failed Save (reaction).'],
['Kai','Climber',4,'Treetop: can move through trees (cannot end on one).','Pounce: tag a target up to 3 squares away.'],
['Gio','Goalie',3,'Home Turf: enemies it tags save at -1.','Freeze: an enemy within 3 cannot move on its next activation.'],
['Kit','Kicker',4,'Strong Kick: carrying the flag, may throw it up to 4 squares to a teammate (as the action).','Long Pass: throw the flag up to 8 squares to a teammate.'],
['Sam','Skater',5,'Glide: after moving, may slide 1 more square.','Slide: move up to 4 squares in a straight line, ignoring dice.'],
['Chloe','Cheerleader',4,'Morale: gain 1 token when you free a teammate.','Big Cheer: teammates within 3 get +1 on Saves until your next turn.'],
['Clyde','Class Clown',4,'Funny Face: enemies tagging within 2 of Clyde: target saves at +1.','Banana Peel: place a banana on an empty square within 2. An enemy entering it slips: move ends, loses its action.'],
['Maya','Mastermind',5,'Plan Ahead: once per turn, re-roll one die for free.','Plot Twist: swap places of two teammates.'],
['Brody','Builder',4,'Pillow Fort: its own square counts as safe for it (not while it carries the flag).','Snow Wall: place a wall on an empty square within 2 until your next turn.'],
['Dex','Daredevil',5,'Reckless: re-roll any die showing 1 when moving.','Double or Nothing: flip the coin. Heads: take a second Sprint. Tails: Dex skips his next activation.'],
].map(([name,type,save,passive,active])=>({name,type,save,passive,active}));

// ---------- board ----------
const T=Array.from({length:H},()=>Array(W).fill('')), SAFE=Array.from({length:H},()=>Array(W).fill(false));
const HOME={1:{x:3,y:7},2:{x:26,y:7}}, JAIL={1:[],2:[]}; // JAIL[t]: the 6 squares holding team t's captives, in enemy land
for(let x=27;x<=29;x++)for(let y=0;y<=1;y++){JAIL[1].push({x,y});const [a,b]=rot(x,y);JAIL[2].push({x:a,y:b});}
(function(){
  const put=(list,fn)=>{for(const [x,y] of list){fn(x,y);const [a,b]=rot(x,y);fn(a,b);}};
  put([[6,2],[7,2],[6,12],[7,12],[10,3],[11,3],[10,4],[10,10],[10,11],[11,11],[12,6],[12,8],[14,3],[14,11],[9,7]],(x,y)=>T[y][x]='tree');
  put([[4,2],[4,12],[8,9],[8,5],[13,4],[13,10]],(x,y)=>T[y][x]='mud');
  put([[11,7],[5,3],[5,11]],(x,y)=>T[y][x]='slide');
  put([[12,3],[12,11],[14,7],[9,2],[9,12]],(x,y)=>SAFE[y][x]=true);
  for(let x=0;x<=2;x++)for(let y=5;y<=9;y++){SAFE[y][x]=true;const [a,b]=rot(x,y);SAFE[b][a]=true;}
})();
const STARTY=[1,3,6,8,11,13], START={1:[],2:[]};
for(const y of STARTY){START[1].push({x:8,y});const [a,b]=rot(8,y);START[2].push({x:a,y:b});}
const baseCells=t=>{const o=[];for(let x=0;x<W;x++)for(let y=0;y<H;y++)if(SAFE[y][x]&&terr(x)===t&&dist({x,y},HOME[t])<=3&&(t===1?x<=2:x>=27))o.push({x,y});return o.sort((a,b)=>dist(a,HOME[t])-dist(b,HOME[t])||a.y-b.y);};

// ---------- settings and sound ----------
const SET=(()=>{let o={sound:true,rm:false,odds:false,board:'forest'};try{o.rm=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);Object.assign(o,JSON.parse(localStorage.getItem('flagfight.settings')||'{}'));}catch(e){}return o;})();
function applySet(){document.documentElement.dataset.rm=SET.rm?'1':'';if(document.body)document.body.dataset.board=SET.board;}
function saveSet(){try{localStorage.setItem('flagfight.settings',JSON.stringify(SET));}catch(e){}applySet();}
let AC=null;
function sfx(n){
  if(!SET.sound||window.__fast)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime;
    const tone=(f,d,type,v,dt,f2)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t+(dt||0));if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+(dt||0)+d);g.gain.setValueAtTime(v||.1,t+(dt||0));g.gain.exponentialRampToValueAtTime(.0001,t+(dt||0)+d);o.connect(g);g.connect(AC.destination);o.start(t+(dt||0));o.stop(t+(dt||0)+d+.02);};
    if(n==='dice')for(let i=0;i<8;i++)tone(180+Math.random()*240,.05,'square',.045,i*.075);
    else if(n==='tag')tone(150,.2,'sawtooth',.13,0,55);
    else if(n==='save'){tone(520,.1,'triangle',.1);tone(780,.16,'triangle',.1,.09);}
    else if(n==='jail'){tone(330,.12,'square',.07);tone(220,.22,'square',.07,.1);}
    else if(n==='flag')[523,659,784].forEach((f,i)=>tone(f,.15,'triangle',.1,i*.09));
    else if(n==='win')[523,659,784,1047].forEach((f,i)=>tone(f,.24,'triangle',.12,i*.12));
    else if(n==='coin')tone(900,.6,'sine',.06,0,300);
  }catch(e){}
}
function newStats(){return {turns:0,att:0,saved:0,jailed:0,drops:0,tok:{1:0,2:0},events:[],per:{},t0:Date.now()};}
function trackedTokens(){
  const v={1:2,2:2},o={};
  for(const k of [1,2])Object.defineProperty(o,k,{enumerable:true,get:()=>v[k],set:n=>{if(n<v[k]&&typeof G!=='undefined'&&G&&G.stats)G.stats.tok[k]+=v[k]-n;v[k]=n;}});
  return o;
}
function evt(text,team){if(G&&G.stats&&G.stats.events.length<80)G.stats.events.push({t:G.stats.turns,team,text});}

// ---------- state ----------
let G, UI={prompt:'',buttons:[],cells:null,resolve:null,banner:''};
function newGame(){
  const rules=G?G.rules:{stack:true},names=G?G.names:null,ai=G?G.ai:null;
  G={phase:'setup',rules,chars:[],tokens:trackedTokens(),flags:{1:{x:3,y:7,c:null},2:{x:26,y:7,c:null}},markers:[],cur:1,log:[],over:null,dice:null,used:[0,0],picks:[],drafter:0,order:[],pending:false,coin:null,names,ai,sel:null,sub:'',stats:newStats(),trail:null};
}
const ch=id=>G.chars[id];
const teamChars=t=>G.chars.filter(c=>c.team===t);
const alive=c=>!c.jail;
const charAt=(x,y)=>G.chars.find(c=>!c.jail&&c.x===x&&c.y===y);
const wallAt=(x,y)=>G.markers.find(m=>m.type==='wall'&&m.x===x&&m.y===y);
const bananaAt=(x,y)=>G.markers.find(m=>m.type==='banana'&&m.x===x&&m.y===y);
const cap=t=>teamChars(t).some(c=>c.name==='Cal')?4:3;
const addTokens=(t,n)=>{G.tokens[t]=Math.min(cap(t),G.tokens[t]+n);};
const log=m=>{G.log.unshift(m);if(G.log.length>80)G.log.pop();};
const has=n=>G.chars.find(c=>c.name===n);

// ---------- UI plumbing ----------
function input(prompt,buttons=[],cells=null){
  return new Promise(res=>{
    UI.prompt=prompt;UI.buttons=buttons;UI.cells=cells?new Set(cells.map(c=>c.x+','+c.y)):null;UI.resolve=res;UI.who=G.cur;UI.iid=(UI.iid||0)+1;
    render();aiHook();
  });
}
function answer(v){const r=UI.resolve;if(!r)return;UI.resolve=null;UI.cells=null;UI.buttons=[];UI.prompt='';r(v);}
const ask=async(prompt,btns)=>(await input(prompt,btns)).btn;
async function flash(text,ms=1100){UI.banner=text;render();await sleep(ms);UI.banner='';render();}
async function rollDice(){
  G.aiRR=false;sfx('dice');
  if(!SET.rm){UI.rolling=[1,1];for(let i=0;i<9;i++){G.dice=[d6(),d6()];G.used=[0,0];render();await sleep(80);}}
  UI.rolling=null;UI.landed=SET.rm?null:[1,1];
  G.dice=[d6(),d6()];G.used=[0,0];log(`${tn(G.cur)} rolls ${G.dice[0]} and ${G.dice[1]}`);render();UI.landed=null;
}
const mayaFree=()=>!!G.mayaFree&&teamChars(G.cur).some(c=>c.name==='Maya'&&alive(c));
async function rerollDie(i){
  if(mayaFree())G.mayaFree=false;else G.tokens[G.cur]--;
  sfx('dice');
  if(!SET.rm){UI.rolling=[0,0];UI.rolling[i]=1;for(let k=0;k<6;k++){G.dice[i]=d6();render();await sleep(80);}}
  UI.rolling=null;UI.landed=SET.rm?null:[0,0];if(UI.landed)UI.landed[i]=1;
  G.dice[i]=d6();log(`${tn(G.cur)} re-rolls: die is now ${G.dice[i]}`);render();UI.landed=null;
}

// ---------- geometry / movement ----------
function classify(c,x,y){
  if(x<0||y<0||x>=W||y>=H)return 'out';
  if(wallAt(x,y))return 'wall';
  if(T[y][x]==='tree')return 'tree';
  const o=charAt(x,y);
  if(o&&o!==c)return o.team===c.team?'ally':'enemy';
  return 'free';
}
const passable=(c,k,o)=>k==='free'||k==='ally'||(k==='enemy'&&o.jump)||(k==='tree'&&c.name==='Kai');
const endable=(c,x,y)=>classify(c,x,y)==='free';
function landing(c,x,y,dir){
  const b=bananaAt(x,y);
  if(b&&b.team!==c.team)return{x,y,slip:b};
  const t=T[y][x];
  if(t==='mud')return{x,y};
  if(t==='slide'){
    let px=x,py=y,fx=x,fy=y;
    for(let i=0;i<2;i++){const nx=px+dir.x,ny=py+dir.y;if(!passable(c,classify(c,nx,ny),{}))break;px=nx;py=ny;if(classify(c,px,py)==='free'){fx=px;fy=py;}}
    return{x:fx,y:fy};
  }
  return null;
}
function traverse(c,start,dir,n,h,o={}){
  const out=[];let x=start.x,y=start.y,used=0;
  while(used<n){
    let nx=x+dir.x,ny=y+dir.y,cost=1,k=classify(c,nx,ny);
    if(!passable(c,k,o)){
      if(h>0&&(k==='enemy'||k==='tree')&&used+2<=n){
        const jx=nx+dir.x,jy=ny+dir.y,k2=classify(c,jx,jy);
        if(passable(c,k2,o)){h--;nx=jx;ny=jy;k=k2;cost=2;}else break;
      }else break;
    }
    used+=cost;
    if(k==='free'){const L=landing(c,nx,ny,dir);if(L){out.push({x:L.x,y:L.y,h,term:true,slip:L.slip,dir,ok:endable(c,L.x,L.y)});break;}}
    x=nx;y=ny;
    out.push({x,y,h,term:false,dir,ok:endable(c,x,y)});
  }
  return out;
}
function zoneOK(c,x,y){
  const h=HOME[c.team];
  if(dist({x,y},h)>3||c.exempt>0||dist(c,h)<=3)return true;
  return teamChars(c.team).filter(o=>o!==c&&alive(o)&&o.exempt<=0&&dist(o,h)<=3).length<2;
}
const hur=c=>c.name==='Hudson'?1:0;
function lineCells(c,n,o={}){
  const m=new Map();
  for(const d of D4)for(const r of traverse(c,c,d,n,o.noHurdle?0:hur(c),o))if(r.ok&&zoneOK(c,r.x,r.y)){const k=r.x+','+r.y;if(!m.has(k))m.set(k,r);}
  return m;
}
function sprintCells(c,assigns){
  const m=new Map();
  const add=r=>{if(r.ok&&zoneOK(c,r.x,r.y)){const k=r.x+','+r.y;if(!m.has(k))m.set(k,r);}};
  for(const [a,b] of assigns)for(const order of [0,1]){
    const s=order?[{n:b,d:VD},{n:a,d:HD}]:[{n:a,d:HD},{n:b,d:VD}];
    const s2=order?[{n:a,d:HD}]:[{n:b,d:VD}];
    for(const d1 of s[0].d)for(const r of traverse(c,c,d1,s[0].n,hur(c))){
      add(r);
      if(!r.term)for(const d2 of s[1].d)for(const q of traverse(c,r,d2,s[1].n,r.h))add(q);
    }
  }
  return m;
}
function eff(c,d){
  const f=G.flags[3-c.team];
  let v=d;
  if(f.c===c.id&&c.name!=='Scarlett')v=Math.max(1,v-1);
  if(c.name==='Zoe')v+=1;
  return v;
}
function placeChar(c,x,y){
  c.x=x;c.y=y;
  for(const t of [1,2])if(G.flags[t].c===c.id){G.flags[t].x=x;G.flags[t].y=y;}
  checkWin();
}
function swapPos(a,b){
  const ax=a.x,ay=a.y;a.x=b.x;a.y=b.y;b.x=ax;b.y=ay;
  for(const t of [1,2]){const f=G.flags[t];if(f.c===a.id||f.c===b.id){const k=ch(f.c);f.x=k.x;f.y=k.y;}}
  checkWin();
}
function applyMove(c,r){
  G.trail={x0:c.x,y0:c.y,x1:r.x,y1:r.y};
  placeChar(c,r.x,r.y);
  if(r.slip){G.markers=G.markers.filter(m=>m!==r.slip);log(`${c.name} slips on a banana and loses the action!`);return true;}
  return false;
}
function checkWin(){
  for(const t of [1,2]){
    const f=G.flags[3-t];
    if(f.c!=null){const k=ch(f.c);if(homeReached(k))win(k.team,`${k.name} #${numOf(k.name)} carried the flag home to a starting square.`,k.id);}
    if(teamChars(t).every(c=>c.jail))win(3-t,`All of ${tn(t)}'s characters are in jail.`);
  }
}
function homeReached(k){
  const st=START[k.team];
  if(st.some(p=>p.x===k.x&&p.y===k.y))return true;
  const blocked=st.every(p=>{const o=charAt(p.x,p.y);return o&&o!==k;});
  return blocked&&dist(k,HOME[k.team])<=3;
}
function win(team,why,mvp){
  if(mvp==null)mvp=teamChars(team).slice().sort((a,b)=>(b.tags||0)-(a.tags||0))[0].id;
  G.over={team,why,mvp};sfx('win');evt(why,team);log(`${tn(team)} wins: ${why}`);throw new GameOver();
}

// ---------- tagging ----------
function los(a,b){
  let x=a.x,y=a.y;const dx=Math.abs(b.x-a.x),dy=Math.abs(b.y-a.y),sx=a.x<b.x?1:-1,sy=a.y<b.y?1:-1;let e=dx-dy;
  while(!(x===b.x&&y===b.y)){
    const e2=2*e;if(e2>-dy){e-=dy;x+=sx;}if(e2<dx){e+=dx;y+=sy;}
    if(x===b.x&&y===b.y)break;
    if(T[y][x]==='tree'||wallAt(x,y))return false;
  }
  return true;
}
function isSafe(o){
  if(SAFE[o.y][o.x])return true;
  const b=teamChars(o.team).find(k=>k.name==='Brody'&&alive(k));
  return !!b&&b===o&&G.flags[3-b.team].c!==b.id;
}
function tagTargets(c,range){
  if(terr(c.x)!==c.team)return [];
  return G.chars.filter(o=>o.team!==c.team&&alive(o)&&terr(o.x)===c.team&&dist(c,o)<=range&&!isSafe(o)&&(o.name!=='Shay'||dist(c,o)<=1)&&los(c,o));
}
function saveMod(t,tagger){
  const pos=[],neg=[];
  const gabe=teamChars(t.team).find(g=>g.name==='Gabe'&&alive(g)&&g!==t&&dist(g,t)<=1);if(gabe)pos.push(1);
  if(t.cheer)pos.push(1);
  const cl=teamChars(t.team).find(g=>g.name==='Clyde'&&alive(g)&&dist(g,tagger)<=2);if(cl)pos.push(1);
  if(tagger.name==='Gio')neg.push(-1);
  const p=G.rules.stack?pos.reduce((a,b)=>a+b,0):Math.max(0,...pos);
  return p+neg.reduce((a,b)=>a+b,0);
}
function sendToJail(target,tagger){
  const f=G.flags[3-target.team];
  if(f.c===target.id){f.c=null;f.x=target.x;f.y=target.y;log(`${target.name} drops the flag!`);G.stats.drops++;evt(`${target.name} drops the flag`,target.team);}
  target.jail=true;target.x=target.y=null;tagger.tags=(tagger.tags||0)+1;
  G.stats.jailed++;const pj=G.stats.per[target.id],pt=G.stats.per[tagger.id];if(pj)pj.jail++;if(pt)pt.tags++;sfx('jail');evt(`${tagger.name} tags ${target.name}`,tagger.team);
  addTokens(tagger.team,1+(tagger.name==='Tessa'?1:0));
  log(`${tagger.name} tags ${target.name}: to jail! (+token)`);
  checkWin();
}
async function savePop(p,buttons,autoMs){

  if(autoMs)t=setTimeout(()=>{if(UI.resolve&&UI.popup&&UI.popup.type==='save')answer({btn:'ok'});},autoMs);
  const r=await input('',buttons);

async function rollAnim(b){
  if(SET.rm){UI.popup={type:'save',...b,stage:'roll',val:d6()};render();return;}
  sfx('dice');
  for(let i=0;i<13;i++){UI.popup={type:'save',...b,stage:'roll',val:d6()};render();await sleep(90+i*24);}

async function tagFlow(tagger,target){
  G.stats.att++;
  const gabe=teamChars(target.team).find(g=>g.name==='Gabe'&&alive(g)&&g!==target&&dist(g,target)<=2);
  const toks=t=>`${tn(t)} has ${G.tokens[t]} token${G.tokens[t]===1?'':'s'}.`;
  if(gabe&&G.tokens[target.team]>=1){
    const d0=dist(tagger,target),n0=target.save+(d0<=1?1:0);
    const a=await savePop({tagger,target,need:n0,mod:saveMod(target,tagger),stage:'pre',msg:`${tn(target.team)} can still react before the tag lands. ${toks(target.team)}`},[{id:'y',label:`Gabe #${numOf('Gabe')}: Take the Tag (1 token)`},{id:'n',label:'No thanks',k:'pri'}]);
    if(a==='y'){G.tokens[target.team]--;log(`Gabe takes the tag for ${target.name}!`);target=gabe;}
  }
  const d=dist(tagger,target),need=target.save+(d<=1?1:0),mod=saveMod(target,tagger);
  let r=d6(),ok=r+mod>=need;
  await rollAnim({tagger,target,need,mod});
  let st={tagger,target,need,mod,stage:'result',val:r,ok};sfx(ok?'save':'tag');
  UI.popup={type:'save',...st};render();await sleep(1200);
  const mia=teamChars(target.team).find(m=>m.name==='Mia'&&alive(m)&&m!==target&&dist(m,target)<=2);
  if(!ok&&mia){r=d6();ok=r+mod>=need;log('Mia: First Aid re-roll');st={...st,val:r,ok};await rollAnim({tagger,target,need,mod,msg:'Mia: First Aid re-roll'});UI.popup={type:'save',...st,msg:'Mia: First Aid re-roll'};render();await sleep(1200);}
  while(!ok){
    const opts=[];
    if(target.name==='Danny'&&G.tokens[target.team]>=1)opts.push({id:'juke',label:'Juke (1 token)'});
    const mi2=teamChars(target.team).find(m=>m.name==='Mia'&&alive(m)&&m!==target&&dist(m,target)<=3);
    if(mi2&&G.tokens[target.team]>=1)opts.push({id:'patch',label:`Mia #${numOf('Mia')}: Patch Up (1 token)`});
    if(!opts.length)break;
    const a=await savePop({...st,msg:`${tn(target.team)} can still react before the tag lands. ${toks(target.team)}`},[...opts,{id:'no',label:'Accept the tag',k:'pri'}]);
    if(a==='no')break;
    G.tokens[target.team]--;r=d6();ok=r+mod>=need;st={...st,val:r,ok};
    await rollAnim({tagger,target,need,mod});
    UI.popup={type:'save',...st};render();await sleep(1200);
  }
  await savePop({...st,msg:ok?`${target.name} saved.`:`${target.name} is tagged and goes to jail.`},[{id:"ok",label:"Continue",k:"pri"}],2200);
  UI.popup=null;
  {const pp=G.stats.per[target.id];if(pp)pp.att++;if(ok){G.stats.saved++;if(pp)pp.saves++;}}
  if(ok){log(`${target.name} saves against ${tagger.name}`);return;}
  sendToJail(target,tagger);
}

const shayCells=c=>{const o=[];for(let x=0;x<W;x++)for(let y=0;y<H;y++)if(SAFE[y][x]&&dist(c,{x,y})<=6&&classify(c,x,y)==='free'&&zoneOK(c,x,y))o.push({x,y});return o;};
const shoveT=c=>G.chars.filter(o=>o.team!==c.team&&alive(o)&&Math.abs(o.x-c.x)+Math.abs(o.y-c.y)===1&&swappable(o));
const carrying=c=>G.flags[3-c.team].c===c.id;
async function throwFlag(c,range,costs){
  const o=await pickChar('Throw the flag to whom?',near(c,range,o=>o.team===c.team));if(!o)return false;
  if(costs)pay(c);
  G.flags[3-c.team].c=o.id;placeChar(o,o.x,o.y);log(`${c.name} throws the flag to ${o.name}`);return true;
}
function buildActions(c,ctx){
  const A=[],tok=G.tokens[c.team]>=1,f=G.flags[3-c.team],mf=G.flags[c.team],rg=c.name==='Bo'?3:2;
  const add=(id,label,off,okD,noD,run)=>A.push({id,label,off,d:off?noD:okD,run});
  add('tag','Tag',!tagTargets(c,rg).length,`Tag an enemy within ${rg} squares`,`No enemy within ${rg} squares`,()=>doTag(c,rg,false));
  add('free','Free teammate',!canFree(c),'Free a jailed teammate',teamChars(c.team).some(o=>o.jail)?(carrying(c)?'Not while carrying the flag':'Not at the jail'):'Nobody is jailed',()=>freeAction(c,false));
  add('grab','Grab flag',!(f.c==null&&f.x===c.x&&f.y===c.y),`Pick up ${tn(3-c.team)}'s flag`,'Not on the enemy flag',async()=>{f.c=c.id;placeChar(c,c.x,c.y);log(`${c.name} grabs the ${tn(3-c.team)} flag!`);await capPop(c);return true;});
  add('home','Send flag home',!(mf.c==null&&mf.x===c.x&&mf.y===c.y&&(mf.x!==HOME[c.team].x||mf.y!==HOME[c.team].y)),'Return your dropped flag to its base','Your flag is not here',async()=>{mf.x=HOME[c.team].x;mf.y=HOME[c.team].y;log(`${c.name} sends the flag home`);return true;});
  if(c.name==='Kit')add('throw','Throw flag (4)',!(carrying(c)&&near(c,4,o=>o.team===c.team).length),'Free · throw the flag up to 4 squares','Needs the flag and a teammate in range',()=>throwFlag(c,4,false));
  const effs=parseAb(rosterOf(c.name).active);
  for(const [i,ab] of (ABIL[c.name]||[]).entries()){
    const off=!tok||!ab.can(c);
    add('ab'+i,ab.label,off,'1 token · '+(effs[i]?effs[i].e:'').replace(/\.$/,''),!tok?'Needs 1 token':'No valid target',()=>ab.run(c));
  }
  if(ctx.step)add('step','1-square step',lineCells(c,1,{noHurdle:true}).size===0,'Free · move 1 square','No square to step to',async()=>{
    const m=lineCells(c,1,{noHurdle:true});const cell=await pickCell(`${c.name}: step to...`,[...m.values()]);if(!cell)return false;applyMove(c,m.get(cell.x+','+cell.y));return true;});

}
async function actionPhase(c,ctx={}){
  G.sel=c.id;
  if(ctx.slip)return 'done';
  if(c.skipAct>0){log(`${c.name} sits out`);return 'done';}
  for(;;){
    const acts=buildActions(c,ctx);
    const btns=acts.map(a=>({id:a.id,label:a.label,off:a.off,d:a.d}));
    if(c.name==='Sam'&&ctx.dir&&!ctx.glided)btns.push({id:'glide',label:'Glide +1',d:'Free · slide 1 more square'});
    btns.push({id:'skip',label:ctx.back?'Back':'No action'});
    const r=await input(`${c.name} (${tn(c.team)}): choose an action`,btns);
    if(r.btn==='skip')return ctx.back?'back':'skip';
    if(r.btn==='glide'){
      const r1=traverse(c,c,ctx.dir,1,0).find(q=>q.ok&&zoneOK(c,q.x,q.y));
      if(r1){applyMove(c,r1);ctx.glided=true;log('Sam glides one more square');}else log('Sam cannot glide further');
      ctx.glided=true;continue;
    }
    const a=acts.find(x=>x.id===r.btn);
    if(a&&await a.run())return 'done';
  }
}

// ---------- turns ----------
const movers=(skip=[])=>teamChars(G.cur).filter(c=>alive(c)&&!c.frozen&&!skip.includes(c.id));
function dexFix(c,idx){
  if(c.name!=='Dex')return;
  for(const i of idx)if(G.dice[i]===1){G.dice[i]=d6();log(`Dex re-rolls a 1: now ${G.dice[i]}`);}
}
async function chooseDest(c,m){
  const r=await input(`${c.name}: choose a destination`,[{id:'stay',label:'Stay put'},{id:'back',label:'Back'}],[...m.values()]);
  if(r.btn==='back')return 'back';
  if(r.btn==='stay')return {};
  return m.get(r.cell.x+','+r.cell.y);
}
async function sprint(){
  G.sub=`Move ${G.moveNo||1} of 2 · Sprint`;
  await rollDice();
  for(;;){
    G.sel=null;
    const mv=movers();
    if(!mv.length){log('Nobody can move');break;}
    const btns=[0,1].map(i=>({id:'r'+i,label:`Re-roll ${G.dice[i]} (${mayaFree()?'free':'1 token'})`,off:G.tokens[G.cur]<1&&!mayaFree()}));
    const r=await input(`Sprint (${G.dice[0]} & ${G.dice[1]}): choose a character`,btns,mv);
    if(r.btn){await rerollDie(+r.btn[1]);continue;}
    const c=charAt(r.cell.x,r.cell.y);G.sel=c.id;
    dexFix(c,[0,1]);
    const [d0,d1]=G.dice.map(v=>eff(c,v));
    let assigns=[[d0,d1]];
    if(d0!==d1){
      const a=await ask(`${c.name}: which die goes across (left/right) and which goes up/down?`,[{id:'a',label:`${d0} across, ${d1} up/down`},{id:'b',label:`${d1} across, ${d0} up/down`},{id:'back',label:'Back'}]);
      if(a==='back')continue;
      assigns=[a==='a'?[d0,d1]:[d1,d0]];
    }
    const m=sprintCells(c,assigns);
    if(!m.size)log(`${c.name} has no legal path`);
    const res=m.size?await chooseDest(c,m):{};
    if(res==='back')continue;
    G.used=[1,1];
    const slip=res.x!==undefined?applyMove(c,res):false;
    if(slip)await slipPop(c,res.slip);
    await actionPhase(c,{slip,moved:true,dir:res.dir});
    break;
  }
  G.dice=null;G.sel=null;
}
async function teamPlay(){
  G.sub=`Move ${G.moveNo||1} of 2 · Team Play`;
  await rollDice();
  const done=[];
  for(let n=0;n<2;n++){
    for(;;){
      G.sel=null;
      const mv=movers(done);
      const free=[0,1].filter(i=>!G.used[i]);
      if(!mv.length)break;
      const btns=free.map(i=>({id:'r'+i,label:`Re-roll ${G.dice[i]} (${mayaFree()?'free':'1 token'})`,off:G.tokens[G.cur]<1&&!mayaFree()}));
      const r=await input(`Team Play: character ${n+1} of 2 (dice ${free.map(i=>G.dice[i]).join(' / ')})`,btns,mv);
      if(r.btn){await rerollDie(+r.btn[1]);continue;}
      const c=charAt(r.cell.x,r.cell.y);G.sel=c.id;
      let di=free[0];
      if(free.length>1){
        const a=await ask(`${c.name}: use which die?`,[...free.map(i=>({id:'d'+i,label:`Die ${G.dice[i]}`})),{id:'back',label:'Back'}]);
        if(a==='back')continue;di=+a[1];
      }
      dexFix(c,[di]);
      const m=lineCells(c,eff(c,G.dice[di]));
      if(!m.size)log(`${c.name} has no legal path`);
      const res=m.size?await chooseDest(c,m):{};
      if(res==='back')continue;
      G.used[di]=1;done.push(c.id);
      const slip=res.x!==undefined?applyMove(c,res):false;
      if(slip)await slipPop(c,res.slip);
      await actionPhase(c,{slip,moved:true,dir:res.dir});
      break;
    }
  }
  G.dice=null;G.sel=null;
}
async function oneAction(){
  G.sub=`Move ${G.moveNo||1} of 2 · Action`;
  for(;;){
    G.sel=null;
    const r=await input('Action: choose a character',[{id:'back',label:'Back'}],teamChars(G.cur).filter(alive));
    if(r.btn){G.sel=null;return false;}
    const c=charAt(r.cell.x,r.cell.y);
    if(await actionPhase(c,{step:true,back:true})==='done'){G.sel=null;return true;}
  }
}
function zoneOver(t){
  const h=HOME[t],l=teamChars(t).filter(c=>alive(c)&&c.exempt<=0&&dist(c,h)<=3);
  return l.length>2?l:[];
}
function relocate(c){
  for(let r=1;r<15;r++)for(let x=c.x-r;x<=c.x+r;x++)for(let y=c.y-r;y<=c.y+r;y++)
    if(Math.max(Math.abs(x-c.x),Math.abs(y-c.y))===r&&x>=0&&y>=0&&x<W&&y<H&&classify(c,x,y)==='free'&&dist({x,y},HOME[c.team])>3){placeChar(c,x,y);return;}
}
async function finishTurn(){
  const t=G.cur;
  for(;;){
    const over=zoneOver(t);if(!over.length)break;
    const r=await input('Flag zone limit: only 2 of your characters may end a turn within 3 squares of your flag. Pick one to move out.',[],over);
    relocate(charAt(r.cell.x,r.cell.y));
  }
  for(const c of teamChars(t)){if(c.frozen>0)c.frozen--;if(c.skipAct>0)c.skipAct--;if(c.exempt>0)c.exempt--;}
  G.cur=3-t;
}
async function takeTurn(){
  const t=G.cur;G.stats.turns++;
  teamChars(t).forEach(c=>c.cheer=false);
  G.mayaFree=true;
  G.markers=G.markers.filter(m=>!(m.type==='wall'&&m.team===t));
  log(`— ${tn(t)}'s turn —`);
  for(let n=1;n<=2;n++){
    G.moveNo=n;G.sel=null;G.sub=`Move ${n} of 2`;
    const btns=[{id:'sprint',label:'Sprint',d:'Roll the dice. One character moves.'},{id:'team',label:'Team Play',d:'Roll the dice. Two characters move.'},{id:'action',label:'Action',d:'Tag, use an ability, or take one step.'}];
    if(n===2)btns.push({id:'end',label:'End turn'});
    const r=await input(`${tn(t)}: choose move ${n} of 2`,btns);
    if(r.btn==='end')break;
    if(r.btn==='sprint')await sprint();
    else if(r.btn==='team')await teamPlay();
    else if(!await oneAction()){n--;continue;}
    while(G.pending){G.pending=false;log('Dex: second Sprint');await sprint();}
  }
  await finishTurn();
}
async function run(){
  try{for(;;)await takeTurn();}
  catch(e){if(!(e instanceof GameOver))throw e;UI.prompt='';UI.buttons=[];UI.cells=null;render();}

// ---------- computer player ----------
const AIL={easy:{noise:34,abil:0,risk:.35,react:.5,reroll:0},normal:{noise:9,abil:1,risk:1,react:.9,reroll:1},hard:{noise:1.5,abil:1,risk:1.2,react:1,reroll:1}};
const aiLvl=t=>AIL[(G.ai&&G.ai[t])]||AIL.normal;
const mdist=(c,x,y)=>Math.abs(c.x-x)+Math.abs(c.y-y);
const nearStart=(t,c)=>Math.min(...START[t].map(p=>Math.abs(c.x-p.x)+Math.abs(c.y-p.y)));
const rangeOf=c=>c.name==='Bo'?3:2;
const failP=(c,d)=>Math.min(1,Math.max(0,(c.save+(d<=1?1:0)-1)/6));
function aiRisk(t,myC,thC){
  let total=0;
  for(const c of myC){
    if(terr(c.x)===t||isSafe(c))continue;
    const w=carrying(c)?170:26;
    let p=1;
    for(const e of thC){
      if(terr(e.x)===t||e.frozen)continue;
      const d=dist(e,c),rg=rangeOf(e);
      if(d<=rg&&los(e,c)&&!(c.name==='Shay'&&d>1))p*=1-failP(c,d);
      else if(d<=rg+5)p*=1-failP(c,Math.max(2,d))*.22;
    }
    total+=w*(1-p);
  }
  return total;
}
function aiOpp(t,myC,thC,ecar){
  let total=0;
  for(const e of thC){
    if(terr(e.x)!==t||isSafe(e))continue;
    const w=e===ecar?60:10;
    let p=1;
    for(const m of myC){
      if(terr(m.x)!==t)continue;
      const d=dist(m,e),rg=rangeOf(m);
      if(d<=rg&&los(m,e))p*=1-failP(e,d);else if(d<=rg+4)p*=1-failP(e,Math.max(2,d))*.2;
    }
    total+=w*(1-p);
  }
  return total;
}
function aiEval(t){
  const o=3-t,L=aiLvl(t);
  const myC=teamChars(t).filter(alive),thC=teamChars(o).filter(alive);
  const ef=G.flags[o],mf=G.flags[t];
  let s=(teamChars(o).length-thC.length)*42-(teamChars(t).length-myC.length)*42;
  const mine=ef.c!=null?ch(ef.c):null;
  if(mine&&mine.team===t){s+=210-9*nearStart(t,mine);}
  else{
    const ds=myC.map(c=>mdist(c,ef.x,ef.y)).sort((a,b)=>a-b);
    s-=(ds.length?ds[0]:30)*3.2+(ds.length>1?ds[1]:30)*1.2;
    if(ds.length&&ds[0]===0)s+=70;
  }
  const ecar=mf.c!=null?ch(mf.c):null;
  if(ecar&&ecar.team===o){
    s-=210-9*nearStart(o,ecar);
    const dd=myC.map(c=>dist(c,ecar)).sort((a,b)=>a-b);
    s-=(dd.length?dd[0]:20)*5+(dd.length>1?dd[1]:20)*2;
  }else{
    const m=Math.min(30,...thC.map(c=>mdist(c,mf.x,mf.y)));
    s+=m*1.6;
    if(mf.c==null&&(mf.x!==HOME[t].x||mf.y!==HOME[t].y)){
      const dd=Math.min(30,...myC.map(c=>mdist(c,mf.x,mf.y)));
      s-=dd*4+25;
    }
  }
  s+=G.tokens[t]*7-G.tokens[o]*5;
  s-=aiRisk(t,myC,thC)*L.risk;
  s+=aiOpp(t,myC,thC,ecar&&ecar.team===o?ecar:null);
  return s;
}
function aiScoreAt(c,x,y){
  const ox=c.x,oy=c.y;c.x=x;c.y=y;
  let v;try{v=aiEval(c.team);}finally{c.x=ox;c.y=oy;}
  return v;
}
function aiSwapScore(a,b){
  const ax=a.x,ay=a.y;a.x=b.x;a.y=b.y;b.x=ax;b.y=ay;
  let v;try{v=aiEval(a.team);}finally{b.x=a.x;b.y=a.y;a.x=ax;a.y=ay;}
  return v;
}
const aiN=t=>(Math.random()-.5)*2*aiLvl(t).noise;
function aiBestCell(c,cells,t){
  let best=null,bs=-1e9;
  for(const q of cells){const v=aiScoreAt(c,q.x,q.y)+aiN(t);if(v>bs){bs=v;best=q;}}
  return {cell:best,score:bs};
}
const aiParse=()=>UI.cells?[...UI.cells].map(k=>{const [x,y]=k.split(',').map(Number);return{x,y};}):[];
const aiActor=()=>{const p=UI.popup;if(p&&p.type==='save')return p.target.team;return G.cur;};
function aiFallback(){
  const cells=aiParse(),bt=UI.buttons.filter(b=>!b.off);
  if(cells.length)return answer({cell:cells[rnd(cells.length)]});
  const ok=bt.filter(b=>!/^(back|no|n)$/.test(b.id));
  answer({btn:(ok[0]||bt[0]||{id:'ok'}).id});
}
function aiMoveChoice(t,bt){
  const id=x=>bt.find(b=>b.id===x);
  const mine=teamChars(t).filter(alive);
  const free=mine.filter(c=>!c.frozen);
  if(!free.length&&id('end'))return 'end';
  const ef=G.flags[3-t],mf=G.flags[t];
  for(const c of mine){
    if(c.skipAct>0)continue;
    if(tagTargets(c,rangeOf(c)).length)return 'action';
    if(ef.c==null&&ef.x===c.x&&ef.y===c.y)return 'action';
    if(canFree(c))return 'action';
    if(mf.c==null&&mf.x===c.x&&mf.y===c.y&&(mf.x!==HOME[t].x||mf.y!==HOME[t].y))return 'action';
  }
  const car=mine.find(carrying);
  if(car)return 'sprint';
  if(free.length>=2&&Math.random()<.6)return 'team';
  return 'sprint';
}
function aiWant(c,i){
  const L=aiLvl(c.team);if(!L.abil)return false;
  const t=c.team,tok=G.tokens[t],base=aiEval(t);
  const gain=cells=>{let b=-1e9;for(const q of cells)b=Math.max(b,aiScoreAt(c,q.x,q.y));return b-base;};
  const swapGain=list=>{let b=-1e9;for(const o of list)b=Math.max(b,aiSwapScore(c,o));return b-base;};
  const enemyCarrier=G.chars.find(o=>o.team!==t&&alive(o)&&carrying(o));
  switch(c.name){
    case 'Zoe':return tok>=2&&gain([...lineCells(c,2).values()])>14;
    case 'Sam':return tok>=2&&gain([...lineCells(c,4).values()])>14;
    case 'Hudson':return tok>=2&&gain([...lineCells(c,3,{jump:true,noHurdle:true}).values()])>14;
    case 'Shay':return tok>=2&&gain(shayCells(c))>16;
    case 'Rosie':return teamChars(t).filter(o=>o.jail).length>=2&&canFree(c);
    case 'Kai':return tok>=2&&tagTargets(c,3).length>0;
    case 'Gio':return !!enemyCarrier&&dist(c,enemyCarrier)<=3&&!enemyCarrier.frozen;
    case 'Bo':return !!enemyCarrier&&shoveT(c).includes(enemyCarrier);
    case 'Kit':return carrying(c)&&near(c,8,o=>o.team===t).some(o=>nearStart(t,o)+4<nearStart(t,c));
    case 'Scarlett':return tok>=2&&swapGain(near(c,4,o=>o.team===t&&swappable(o)&&swapOK(c,o)))>14;
    case 'Tessa':return tok>=2&&swapGain(near(c,3,o=>swappable(o)&&swapOK(c,o)))>20;
    case 'Maya':{if(tok<2)return false;const l=teamChars(t).filter(o=>alive(o)&&swappable(o));let b=-1e9;for(const a of l)for(const d of l)if(a.id<d.id&&swapOK(a,d)){const ax=a.x,ay=a.y;a.x=d.x;a.y=d.y;d.x=ax;d.y=ay;const v=aiEval(t);d.x=a.x;d.y=a.y;a.x=ax;a.y=ay;b=Math.max(b,v);}return b-base>20;}
    case 'Cal':return i===1&&tok>=3&&mates(c).length>=3;
    case 'Chloe':return tok>=3&&aiRisk(t,teamChars(t).filter(alive),teamChars(3-t).filter(alive))>25;
    case 'Clyde':return tok>=3&&!!enemyCarrier;
    case 'Brody':return tok>=3&&!!enemyCarrier&&dist(c,enemyCarrier)<=6;
    case 'Dex':return tok>=3;
  }
  return false;
}
function aiActionMenu(t,bt){
  const c=ch(G.sel);if(!c)return 'skip';
  const id=x=>bt.find(b=>b.id===x);
  if(id('grab'))return 'grab';
  if(id('tag'))return 'tag';
  if(id('free'))return 'free';
  if(id('home'))return 'home';
  const ab=(ABIL[c.name]||[]);
  for(let i=0;i<ab.length;i++){const b=id('ab'+i);if(b&&aiWant(c,i))return 'ab'+i;}
  if(id('throw')&&near(c,4,o=>o.team===t).some(o=>nearStart(t,o)+3<nearStart(t,c)))return 'throw';
  if(id('glide'))return 'glide';
  if(id('step')){
    const base=aiEval(t);const m=lineCells(c,1,{noHurdle:true});
    const b=aiBestCell(c,[...m.values()],t);
    if(b.cell&&b.score>base+3)return 'step';
  }
  return 'skip';
}
function aiSaveReact(t,bt){
  const L=aiLvl(t),id=x=>bt.find(b=>b.id===x);
  const p=UI.popup;
  if(id('y')){
    const g=teamChars(t).find(k=>k.name==='Gabe'&&alive(k));
    const better=g&&(carrying(p.target)||p.target.save>g.save);
    return better&&Math.random()<L.react?'y':'n';
  }
  if(id('juke')||id('patch')){
    if(Math.random()<L.react)return id('juke')?'juke':'patch';
    return 'no';
  }
  if(id('ok'))return 'ok';
  return bt[bt.length-1].id;
}
function aiTagTarget(cells,t){
  let best=null,bs=-1e9;
  for(const q of cells){
    const e=charAt(q.x,q.y);if(!e)continue;
    let v=(carrying(e)?100:0)+(e.save<4?10*(4-e.save):0)+(e.save>=5?0:0)+(e.save)*-1+aiN(t)*.3;
    v+=failP(e,dist(ch(G.sel)||e,e))*30;
    if(v>bs){bs=v;best=q;}
  }
  return best||cells[0];
}
function aiCharPick(p,cells,t){
  const actor=ch(G.sel);
  const chars=cells.map(q=>({q,c:charAt(q.x,q.y)})).filter(o=>o.c);
  if(!chars.length)return cells[0];
  const base=aiEval(t);
  const enemyCar=chars.find(o=>carrying(o.c)&&o.c.team!==t);
  if(/Freeze|Shove/.test(p)){
    if(enemyCar)return enemyCar.q;
    return chars.slice().sort((a,b)=>mdist(a.c,HOME[t].x,HOME[t].y)-mdist(b.c,HOME[t].x,HOME[t].y))[0].q;
  }
  if(/Throw the flag/.test(p))return chars.slice().sort((a,b)=>nearStart(t,a.c)-nearStart(t,b.c))[0].q;
  if(/Plot Twist: first/.test(p)){
    const l=chars.map(o=>o.c);let best=null,bs=-1e9;
    for(const a of l)for(const d of l)if(a!==d){const v=aiSwapScore(a,d);if(v>bs){bs=v;best=a;}}
    G.aiTmp=best;return chars.find(o=>o.c===best).q;
  }
  if(/Plot Twist: second/.test(p)){
    const a=G.aiTmp;let best=null,bs=-1e9;
    for(const o of chars){const v=a?aiSwapScore(a,o.c):0;if(v>bs){bs=v;best=o;}}
    return best.q;
  }
  if(/swap|Shortcut|Switcheroo/.test(p)&&actor){
    let best=null,bs=-1e9;
    for(const o of chars){const v=aiSwapScore(actor,o.c)+aiN(t);if(v>bs){bs=v;best=o;}}
    return best.q;
  }
  if(/Rally Cry/.test(p)){
    let best=null,bs=-1e9;
    for(const o of chars){const m=lineCells(o.c,1,{noHurdle:true});let g=-1e9;for(const q of m.values())g=Math.max(g,aiScoreAt(o.c,q.x,q.y));g-=base;if(g>bs){bs=g;best=o;}}
    return bs>0.5?best.q:null;
  }
  return chars[rnd(chars.length)].q;
}
function aiAnswer(t){
  const L=aiLvl(t),p=UI.prompt||'',pop=UI.popup,cells=aiParse(),bt=UI.buttons.filter(b=>!b.off);
  const id=x=>bt.find(b=>b.id===x);
  if(pop){
    if(pop.type==='save')return answer({btn:aiSaveReact(t,bt)});
    if(pop.type==='jail'){
      const fs=bt.filter(b=>/^f\d+$/.test(b.id));
      if(id('jb'))return answer({btn:'jb'});
      return answer({btn:(fs[0]||id('back')||bt[0]).id});
    }
    return answer({btn:'ok'});
  }
  if(/choose move/.test(p))return answer({btn:aiMoveChoice(t,bt)});
  if(/^Sprint \(/.test(p)){
    const mv=cells.map(q=>charAt(q.x,q.y)).filter(Boolean);
    const rr=bt.filter(b=>/^r\d$/.test(b.id));
    if(rr.length&&L.reroll&&G.tokens[t]>=2&&!G.aiRR&&Math.min(...G.dice)<=2&&!mv.some(carrying)){
      G.aiRR=true;const lo=G.dice[0]<=G.dice[1]?0:1;return answer({btn:'r'+lo});
    }
    const base=aiEval(t);let best=null,bs=-1e9;
    for(const c of mv){
      const [d0,d1]=G.dice.map(v=>eff(c,v));
      const m=sprintCells(c,[[d0,d1],[d1,d0]]);
      let g=aiBestCell(c,[...m.values()],t).score;if(!m.size)g=base-5;
      g+=carrying(c)?25:0;
      if(g>bs){bs=g;best=c;}
    }
    return answer({cell:{x:best.x,y:best.y}});
  }
  if(/which die goes across/.test(p)){
    const c=ch(G.sel),[d0,d1]=G.dice.map(v=>eff(c,v));
    const a=aiBestCell(c,[...sprintCells(c,[[d0,d1]]).values()],t),b=aiBestCell(c,[...sprintCells(c,[[d1,d0]]).values()],t);
    return answer({btn:(a.score>=b.score?'a':'b')});
  }
  if(/Team Play: character/.test(p)){
    const free=[0,1].filter(i=>!G.used[i]);
    const rr=bt.filter(b=>/^r\d$/.test(b.id));
    const mv=cells.map(q=>charAt(q.x,q.y)).filter(Boolean);
    if(rr.length&&L.reroll&&G.tokens[t]>=2&&!G.aiRR&&free.some(i=>G.dice[i]<=1)){G.aiRR=true;return answer({btn:'r'+free.find(i=>G.dice[i]<=1)});}
    let best=null,bs=-1e9,bd=free[0];
    for(const c of mv)for(const di of free){
      const m=lineCells(c,eff(c,G.dice[di]));
      const g=m.size?aiBestCell(c,[...m.values()],t).score+(carrying(c)?25:0):-1e9+1;
      if(g>bs){bs=g;best=c;bd=di;}
    }
    G.aiDie=bd;
    return answer({cell:{x:best.x,y:best.y}});
  }
  if(/use which die/.test(p)){
    const want='d'+(G.aiDie!=null?G.aiDie:0);
    return answer({btn:id(want)?want:bt.find(b=>/^d\d$/.test(b.id)).id});
  }
  if(/Action: choose a character/.test(p)){
    const mv=cells.map(q=>charAt(q.x,q.y)).filter(Boolean);
    const ef=G.flags[3-t],mf=G.flags[t];
    let pick=mv.find(c=>c.skipAct<=0&&(ef.c==null&&ef.x===c.x&&ef.y===c.y))||mv.find(c=>c.skipAct<=0&&tagTargets(c,rangeOf(c)).length)||mv.find(c=>canFree(c))||mv.find(c=>mf.c==null&&mf.x===c.x&&mf.y===c.y&&(mf.x!==HOME[t].x||mf.y!==HOME[t].y));
    if(!pick){
      const base=aiEval(t);let bs=-1e9;
      for(const c of mv){const m=lineCells(c,1,{noHurdle:true});if(!m.size)continue;const g=aiBestCell(c,[...m.values()],t).score;if(g>bs){bs=g;pick=c;}}
      if(!pick||bs<base+3)return answer({btn:'back'});
    }
    return answer({cell:{x:pick.x,y:pick.y}});
  }
  if(/choose an action/.test(p))return answer({btn:aiActionMenu(t,bt)});
  if(/choose who to tag/.test(p))return answer({cell:aiTagTarget(cells,t)});
  if(/Pep Talk/.test(p))return answer({btn:'back'});
  if(/Banana Peel|Snow Wall/.test(p)){
    const ec=G.chars.find(o=>o.team!==t&&alive(o)&&carrying(o))||G.chars.find(o=>o.team!==t&&alive(o));
    const tgt=ec?{x:ec.x,y:ec.y}:{x:HOME[t].x,y:HOME[t].y};
    let best=cells[0],bd=1e9;for(const q of cells){const d=Math.abs(q.x-tgt.x)+Math.abs(q.y-tgt.y);if(d<bd){bd=d;best=q;}}
    return answer({cell:best});
  }
  if(cells.length){
    const first=cells.map(q=>charAt(q.x,q.y));
    if(first.some(Boolean)){
      const q=aiCharPick(p,cells,t);
      if(q)return answer({cell:q});
      return answer({btn:id('done')?'done':'back'});
    }
    const nm=p.split(':')[0];
    let mover=G.chars.find(k=>k.name===nm&&k.team===t&&alive(k))||ch(G.sel);
    if(!mover)return aiFallback();
    const base=aiEval(t),b=aiBestCell(mover,cells,t);
    if(id('stay')&&b.score<base-2)return answer({btn:'stay'});
    return answer({cell:b.cell});
  }
  aiFallback();
}

  const slots=t=>{const l=G.picks.filter(p=>p.seat===t);return Array.from({length:6},(_,i)=>l[i]?`<span class="slot full" style="background:${TC[t]}">${esc(ROSTER[l[i].i].name.slice(0,2))}</span>`:'<span class="slot"></span>').join('');};
  const cnt=t=>G.picks.filter(p=>p.seat===t).length;
  const cards=ROSTER.map((r,i)=>{const p=G.picks.find(p=>p.i===i);return `<div>${pennant(r,{team:p?p.seat:0,size:'sm'})}${p?`<div class="took t${p.seat}">Drafted by ${esc(tn(p.seat))}</div>`:`<button class="dbtn t${seat}" onclick="pickDraft(${i})">Draft for ${esc(tn(seat))}</button>`}</div>`;}).join('');
  return `<div class="wrap"><div class="dhead"><div><div class="lbl">Snake draft · ${esc(tn(G.drafter))} won the flip</div><h1>Draft your squad</h1></div><div style="display:flex;gap:14px;align-items:center"><div class="order">${order}</div>${menuBtn()}</div></div>
  <div class="drow"><div class="slotp"><div style="display:flex;align-items:center;gap:10px">${chipH(1)}<span class="lbl" style="text-transform:none;letter-spacing:0;font-size:13px">${cnt(1)} of 6 drafted</span></div><div class="slots">${slots(1)}</div></div>
  <div class="pickp">${chipH(seat)}<div class="big">Pick ${run} more character${run>1?'s':''}</div><span style="color:#D9C98A;font-size:13px">${next?`Then ${esc(tn(next))} picks ${run2}.`:'Last pick.'}</span></div>
  <div class="slotp r"><div style="display:flex;align-items:center;gap:10px"><span class="lbl" style="text-transform:none;letter-spacing:0;font-size:13px">${cnt(2)} of 6 drafted</span>${chipH(2)}</div><div class="slots">${slots(2)}</div></div></div>
  <div class="pool">${cards}</div></div>${UI.menu?menuHTML():''}${UI.how?howHTML():''}`;
}
function savePopHTML(p){
  const thr=Math.max(1,p.need-p.mod);
  const meter=[1,2,3,4,5,6].map(n=>`<div class="mt ${n>=thr?'ok':''} ${p.val===n&&p.stage!=='pre'?'cur':''}">${n}</div>`).join('');
  const die=p.stage==='pre'?'<div class="bigdie q">?</div>':`<div class="bigdie ${p.stage==='roll'?'rolling':''}">${pipFace(p.val)}</div>`;
  const stamp=p.stage==='result'?`<span class="stamp ${p.ok?'sav':'tag'}">${p.ok?'SAVED':'TAGGED'}</span>`:'';
  const btns=UI.buttons.map(btnH).join('');
  return `<div class="ov"><div class="pop"><div class="ph">${chipH(p.tagger.team)}<span class="pt">${esc(p.tagger.name)} tags ${esc(p.target.name)}</span><span style="color:var(--muted);font-size:14px;flex:1">${esc(tn(p.target.team))} rolls a Saving Throw</span></div>
  <div class="pgrid"><div>${pcard(p.tagger,{size:'sm'})}</div>
  <div class="pc3"><span class="lbl">${esc(p.target.name)} saves on ${thr>6?'a miracle':thr+' or more'}${SET.odds?` · ${Math.max(0,Math.min(100,Math.round((7-thr)/6*100)))}% to save`:''}</span>${die}<div style="width:100%"><div class="meter">${meter}</div><div class="mlbl"><span>Tagged</span><span>${p.stage==='result'||p.stage==='roll'?'Rolled '+p.val:''}</span><span>Saved</span></div></div>${stamp}</div>
  <div>${pcard(p.target,{size:'sm'})}</div></div>
  <div class="pfoot"><span class="msg">${esc(p.msg||'')}</span>${btns}</div></div></div>`;
}
function specPopHTML(p){
  if(UI.peek)return `<button class="peekback" data-act="peek">Back to the popup</button>`;
  const boxes=(p.boxes||[]).map(b=>`<div class="sbox ${b.dim?'dim':''}" style="border-color:${b.col}"><b style="color:${b.col}">${esc(b.t)}</b><br><span style="font-size:14px;color:var(--soft)">${esc(b.d)}</span></div>`).join('');
  return `<div class="ov"><div class="pop spec"><button class="eye" aria-label="Peek at the map" data-act="peek"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#EEF2F8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3.2"/></svg></button>
  <div>${p.card?pcard(p.card,{size:'sm',clamp:true,sel:true}):''}</div>
  <div class="pc3"><span class="lbl">${esc(p.label)}</span><div class="disc" style="${p.discBg?'background:'+p.discBg:''}">${esc(p.disc)}</div><span style="font-family:var(--disp);font-weight:800;font-size:40px;color:${p.titleCol||'var(--text)'}">${esc(p.title||'')}</span><span style="color:var(--soft);font-size:14px;text-align:center">${esc(p.sub||'')}</span></div>
  <div style="display:flex;flex-direction:column;gap:10px">${boxes}${UI.buttons.map(btnH).join('')}</div></div></div>`;
}
function capPopHTML(p){
  return `<div class="capbar"><span class="ct">${esc(p.title)}</span><span class="cx">${esc(p.text)}</span>${UI.buttons.map(btnH).join('')}</div>`;
}
function jailPopHTML(p){
  const caps=p.caps.map(id=>{const c=ch(id),b=UI.buttons.find(x=>x.id==='f'+id);return `<div class="cap1"><div>${pcard(c,{size:'sm',clamp:true})}</div>${b?btnH({...b,label:'Free'}):''}</div>`;}).join('');
  const rest=UI.buttons.filter(b=>!/^f\d+$/.test(b.id)).map(btnH).join('');
  return `<div class="drawer"><div class="dt">In jail</div><span class="lbl">${esc(tn(p.c.team))} · ${p.caps.length} of 6</span>${caps}${rest}</div>`;
}
function popupHTML(){
  const p=UI.popup;if(!p)return '';
  if(p.type==='save')return savePopHTML(p);
  if(p.type==='spec')return specPopHTML(p);
  if(p.type==='cap')return capPopHTML(p);
  if(p.type==='jail')return jailPopHTML(p);
  return '';
}
function overHTML(){
  const o=G.over,t=o.team,cols=[TC[t],'#FFD54A','#F6F3EA',TC[3-t]];
  const cf=Array.from({length:36},(_,i)=>{const x=(i*97+41)%100,y=(i*53+17)%94,r=(i*37)%180,w=10+(i%4)*4;return `<i class="cf" style="left:${x}%;top:${y}%;width:${w}px;height:${Math.round(w*.45)}px;background:${cols[i%4]};transform:rotate(${r}deg)"></i>`;}).join('');
  const mvp=ch(o.mvp);
  const sq=teamChars(t).map(c=>`<div class="sq"><span style="border-color:${c.id===o.mvp?'#FFD54A':'transparent'}">${numOf(c.name)}</span>${esc(c.name)}</div>`).join('');
  return `<div class="over t${t}">${cf}<div class="in"><div class="l"><span class="go">Game over</span><span class="wins">${esc(tn(t))} wins</span><span class="why">${esc(o.why)}</span>
  <div class="acts"><button class="btn gold" onclick="G=null;newGame();render()">Play again</button><button class="btn g2" onclick="newDraft()">New draft</button><button class="btn g2" data-act="sumopen">Game summary</button></div>
  <div style="margin-top:20px;display:flex;flex-direction:column;gap:10px"><span class="go">The winning squad</span><div class="squad">${sq}</div></div></div>
  <div class="mvp"><span class="bdg">MVP</span>${pcard(mvp,{size:'lg',clamp:false,state:''})}</div></div></div>`;
}
const menuBtn=()=>`<button class="mbtn" data-act="menuopen" aria-label="Open the game menu"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#EEF2F8" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>`;
function menuHTML(){
  const tog=(k,n,d)=>`<div class="mrow"><div><b>${n}</b><span>${d}</span></div><button class="swt ${SET[k]?'on':''}" role="switch" aria-checked="${SET[k]}" aria-label="${n}" data-set="${k}"><i></i></button></div>`;
  const camp=SET.board==='campus';
  return `<div class="ov" data-act="menuclose"><div class="menup" role="dialog" aria-label="Game menu"><div class="mh"><h2>Game paused</h2><span class="lbl">${G.phase==='play'?`Turn ${G.stats.turns} · ${esc(tn(G.cur))}`:'Draft'}</span></div>
  <button class="btn pri big2" data-act="menuclose">Resume</button><button class="btn mb2" data-act="howopen">How to play</button>
  <div class="mbox">${tog('sound','Sound','Dice, tags and wins')}${tog('rm','Reduce motion','No tumbling dice or coin flip')}${tog('odds','Show tag odds','Show the chance before a tag lands')}
  <div class="mrow"><div><b>Board side</b><span>Colors only for now</span></div><div class="seg2"><button class="${camp?'':'on'}" data-set="board" data-v="forest">Forest</button><button class="${camp?'on':''}" data-set="board" data-v="campus">Campus</button></div></div></div>
  <div class="mdanger"><b>Start over?</b><span>This ends the current game for both players. Nothing is saved.</span><div class="mdb"><button class="btn ghost" data-act="menuclose">Keep playing</button><button class="btn red" data-act="restart">Restart game</button></div></div></div></div>`;
}
function sumText(){
  const o=G.over,st=G.stats,mins=Math.max(1,Math.round((Date.now()-st.t0)/60000));
  const L=[`Flag Fight: ${tn(o.team)} won in ${st.turns} turns (${mins} min). ${o.why}`,`Tag attempts ${st.att}: ${st.saved} saved, ${st.jailed} jailed. Flag drops ${st.drops}. Tokens spent: ${tn(1)} ${st.tok[1]}, ${tn(2)} ${st.tok[2]}.`];
  for(const c of G.chars){const p=st.per[c.id]||{};L.push(`${tn(c.team)} ${c.name}: tags ${p.tags||0}, jailed ${p.jail||0}, saves ${p.saves||0}/${p.att||0}`);}
  return L.join('\n');
}
function copySummary(){
  const t=sumText();
  try{navigator.clipboard.writeText(t).then(()=>toast('Summary copied'),()=>toast('Copy not allowed here'));}catch(e){toast('Copy not allowed here');}
}
function summaryHTML(){
  const o=G.over,st=G.stats,mins=Math.max(1,Math.round((Date.now()-st.t0)/60000)),pct=st.att?Math.round(100*st.saved/st.att):0;
  const tiles=[[st.turns,'Turns',`About ${mins} minute${mins>1?'s':''}`,'#EEF2F8'],[st.att,'Tag attempts',`${st.saved} saved, ${st.jailed} jailed`,'#FFD54A'],[pct+'%','Saves made','Tags that did not stick','#8FD08A'],[st.drops,'Flag drops','Carrier tagged','#FF6459'],[st.tok[1]+st.tok[2],'Tokens spent',`${tn(1)} ${st.tok[1]}, ${tn(2)} ${st.tok[2]}`,'#5B94FF']].map(([v,l,d,c])=>`<div class="stile"><span style="color:${c}">${v}</span><b>${l}</b><small>${esc(d)}</small></div>`).join('');
  const ev=st.events.slice(-9).map(e=>`<div class="sev"><span class="sturn">Turn ${e.t}</span><i style="background:${TC[e.team]||'#9FB0C8'}"></i><span>${esc(e.text)}</span></div>`).join('')||'<div class="sev"><span>No events recorded.</span></div>';
  const rows=G.chars.map(c=>{const p=st.per[c.id]||{};return `<span class="srow"><i style="background:${TC[c.team]}">${numOf(c.name)}</i>${esc(c.name)}</span><span>${p.tags||0}</span><span>${p.jail||0}</span><span>${p.saves||0}/${p.att||0}</span>`;}).join('');
  return `<div class="sumscreen"><div class="wrap" style="max-width:1320px"><div class="sumhead"><div><div class="lbl">Game summary · for playtest notes</div><h1><span style="color:${TC[o.team]}">${esc(tn(o.team))}</span> won in ${st.turns} turns</h1></div><button class="btn g3" data-act="sumcopy">Copy as text</button><button class="btn g3" data-act="sumclose">Back</button><button class="btn pri big2" onclick="G=null;newGame();render()">Play again</button></div>
  <div class="stiles">${tiles}</div><div class="s2"><div class="spanel"><h3>What happened</h3>${ev}</div><div class="spanel"><h3>Squads</h3><div class="stable"><span class="sh">Character</span><span class="sh">Tags</span><span class="sh">Jailed</span><span class="sh">Saves</span>${rows}</div></div></div></div></div>`;
}
function screenPlay(){
  const t=G.cur,narrow=window.innerWidth<=1100,lk=aiBusy();
  const dice=G.dice?`<div class="dicerow">${G.dice.map((v,i)=>`<div class="die sm ${G.used[i]?'used':''} ${UI.rolling&&UI.rolling[i]?'rolling':''} ${UI.landed&&UI.landed[i]?'land':''}" title="${v}">${pipFace(v)}</div>`).join('')}</div>`:'';
  const jc=s=>teamChars(s).filter(c=>c.jail).length;
  const rail=s=>`<div class="rail"><div class="rh">${s===1?`${chipH(1)}${pipsH(1)}<span class="grow"></span><span>Jailed ${jc(1)}/6</span>`:`<span>Jailed ${jc(2)}/6</span><span class="grow"></span>${pipsH(2)}${chipH(2)}`}</div>${teamChars(s).map(c=>pcard(c,{size:'sm',clamp:true,sel:G.sel===c.id})).join('')}</div>`;
  const sc=G.sel!=null?ch(G.sel):null;
  const left=sc?pcard(sc,{size:'sm',clamp:true}):'<div class="nosel">No character picked yet. Tap one on the board.</div>';
  const tilesB=UI.buttons.filter(b=>b.d),plainB=UI.buttons.filter(b=>!b.d);
  const lockB=b=>lk?{...b,off:true}:b;
  const dock=`<div class="dock ${UI.resolve&&!lk?'live':''}"><div class="dl">${left}</div><div class="dr"><div class="dprompt">${esc(UI.prompt||(G.over?'Game over':'...'))}</div>${lk?'<span class="dnote">The computer picks its own move. Its choices are not highlighted and your buttons stay locked until it is done.</span>':''}${tilesB.length?`<div class="tiles">${tilesB.map(b=>tileH(lockB(b))).join('')}</div>`:''}<div class="dbtns">${plainB.map(b=>btnH(lockB(b))).join('')}</div></div></div>`;
  const logp=`<div class="logp"><h3>Game log</h3><div class="logs">${G.log.map(l=>`<div>${esc(l)}</div>`).join('')}</div></div>`;
  const legend='<div class="legend"><span>Safe squares have a dot</span><span>Mud stops you</span><span>» Slide +2 squares</span><span>Ringed squares are starting squares</span><span>Gray squares are jail</span></div>';
  const bar=`<div class="tbar">${menuBtn()}${chipH(t)}${G.ai&&G.ai[t]?`<span class="lvl">${esc(G.ai[t])}</span>`:''}<span class="lbl">${esc(G.sub||'')}</span>${lk?'<span class="lbl think" style="color:var(--gold)">Computer is thinking<i></i><i></i><i></i></span>':''}<span class="grow"></span>${dice}</div>`;
  let body;
  if(narrow){
    const tab=UI.tab||'blue';
    const tabs=[['blue',`${tn(1)} squad${jc(1)?' · '+jc(1)+' jailed':''}`],['red',`${tn(2)} squad${jc(2)?' · '+jc(2)+' jailed':''}`],['log','Game log']].map(([k,l])=>`<button class="tabb ${tab===k?'on '+(k==='blue'?'t1':k==='red'?'t2':'t0'):''}" data-act="tab:${k}">${esc(l)}</button>`).join('');
    const pane=tab==='log'?logp:`<div class="tgrid">${teamChars(tab==='blue'?1:2).map(c=>pcard(c,{size:'sm',sel:G.sel===c.id})).join('')}</div>`;
    body=`<div class="center"><div class="boardwrap"><div id="board">${boardHTML()}</div></div>${dock}${legend}<div class="tabs">${tabs}</div><div class="tpane ${tab==='red'?'t2':tab==='blue'?'t1':'t0'}">${pane}</div></div>`;
  }else{
    body=`<div class="play">${rail(1)}<div class="center"><div class="boardwrap"><div id="board">${boardHTML()}</div></div>${dock}${legend}${logp}</div>${rail(2)}</div>`;
  }
  return `${G.over&&!UI.summary?overHTML():''}${G.over&&UI.summary?summaryHTML():''}<div class="wrap">${bar}${body}</div>${popupHTML()}${UI.menu?menuHTML():''}${UI.how?howHTML():''}`;
}
function render(){
  if(window.__fast)return;
  applySet();
  const app=document.getElementById('app');
  document.getElementById('fx').innerHTML=UI.coin?`<div class="coinov"><div class="coinwrap"><div class="coin3d" style="--end:${UI.coin.end}deg"><div class="cface f">${esc(tn(1)[0].toUpperCase())}</div><div class="cface b">${esc(tn(2)[0].toUpperCase())}</div></div></div><div class="coinshadow"></div><div class="coincap">Flipping the coin...</div></div>`:(UI.banner?`<div class="banner">${esc(UI.banner)}</div>`:'');
  if(G.phase==='setup'){app.innerHTML=screenTitle();return;}
  if(G.phase==='toss'){app.innerHTML=screenToss();return;}
  if(G.phase==='draft'){app.innerHTML=screenDraft();aiDraftHook();return;}
  app.innerHTML=screenPlay();
}
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(UI.how){UI.how=false;render();}else if(UI.menu){UI.menu=false;render();}else if(UI.summary){UI.summary=false;render();}
});
function keepTitle(){
  const n1=document.getElementById('n1'),n2=document.getElementById('n2'),rs=document.getElementById('rstack');
  if(n1&&n2)G.names={1:n1.value.trim()||'Blue',2:n2.value.trim()||'Red'};
  if(rs)G.rules.stack=rs.checked;
}
let wasNarrow=window.innerWidth<=1100;
window.addEventListener('resize',()=>{const n=window.innerWidth<=1100;if(n!==wasNarrow){wasNarrow=n;render();}});
document.addEventListener('click',e=>{
  const act=e.target.closest('[data-act]');
  if(act){
    const a=act.dataset.act,direct=act.tagName==='BUTTON'||e.target===act;
    if(a==='howopen'){UI.how=true;render();return;}
    if(a==='howclose'&&direct){UI.how=false;render();return;}
    if(a==='menuopen'){UI.menu=true;render();return;}
    if(a==='menuclose'&&direct){UI.menu=false;render();return;}
    if(a==='restart'){UI.menu=false;UI.how=false;UI.popup=null;UI.resolve=null;UI.summary=false;G=null;newGame();render();return;}
    if(a==='sumopen'){UI.summary=true;render();return;}
    if(a==='sumclose'){UI.summary=false;render();return;}
    if(a==='sumcopy'){copySummary();return;}
    if(a==='opp'){keepTitle();UI.opp=act.dataset.v;render();return;}
    if(a.startsWith('tab:')){UI.tab=a.slice(4);render();return;}
    if(a==='peek'){UI.peek=!UI.peek;render();return;}
  }
  const st=e.target.closest('[data-set]');
  if(st){const k=st.dataset.set;if(k==='board')SET.board=st.dataset.v;else SET[k]=!SET[k];saveSet();render();return;}
  const b=e.target.closest('[data-b]');
  if(b&&UI.resolve&&!aiBusy()){answer({btn:b.dataset.b});return;}
  const c=e.target.closest('#board [data-x]');
  if(c&&UI.resolve&&!aiBusy()&&UI.cells&&UI.cells.has(c.dataset.x+','+c.dataset.y))answer({cell:{x:+c.dataset.x,y:+c.dataset.y}});
});
newGame();
applySet();
render();
</script>
</body>
</html>
